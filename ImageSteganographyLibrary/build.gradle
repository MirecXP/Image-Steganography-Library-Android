apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

android {
    namespace 'com.ayush.imagesteganographylibrary'
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 26 // java.util.Base64, used by :steganography-core

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
    lint {
        targetSdk 34
    }
    testOptions {
        targetSdk 34
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // The codec itself - shared with build tooling that has to encode images without Android.
    api project(':steganography-core')

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Keeps the coordinate the library has always been published under on JitPack.
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = 'com.github.MirecXP'
                artifactId = 'Image-Steganography-Library-Android'
                version = project.findProperty('publishVersion') ?: '1.3'
                from components.release
            }
        }
    }
}
